; Disable Redundant keys configuration
; Settings are read once when the game starts; restart Skyrim after editing.
; Delete this file to restore the default behavior (all actions suppressed).

[Suppressions]
; 1 = suppress this action during gameplay, 0 = leave vanilla behavior
Quicksave=1
Quickload=1
AutoMove=1

[Custom]
; Advanced: comma-separated controlmap user event names to also suppress,
; e.g. CustomEvents=Toggle Always Run,Wait
CustomEvents=

; ----------------------------------------------------------------------
; Reference: vanilla controlmap user events (default keyboard binding)
; Copy any name below into CustomEvents to suppress it.
;
; Forward / Back / Strafe Left / Strafe Right ... W / S / A / D
; Look .......................................... Mouse
; Right Attack/Block ............................ Left mouse button
; Left Attack/Block ............................. Right mouse button
; Ready Weapon .................................. R
; Shout ......................................... Z
; Favorites ..................................... Q
; Hotkey1 .. Hotkey8 ............................ 1 .. 8
; Activate ...................................... E
; Jump .......................................... Space
; Sprint ........................................ Left Alt (hold)
; Run ........................................... Left Shift (hold)
; Toggle Always Run ............................. CapsLock
; Sneak ......................................... Left Ctrl (hold)
; Auto-Move ..................................... C
; Toggle POV .................................... F
; Tween Menu .................................... Tab
; Journal ....................................... J
; Quick Inventory ............................... I
; Quick Magic ................................... P
; Quick Map ..................................... M
; Quick Stats ................................... /
; Wait .......................................... T
; Quicksave ..................................... F5
; Quickload ..................................... F9
; Pause ......................................... Esc
; Console ....................................... ~ (grave)
; Screenshot .................................... PrintScreen
;
; Suppressing movement and combat events makes the game unplayable;
; filter toggle and menu-type actions only.
; Matching is case-insensitive; the game reads this file at startup.
; ----------------------------------------------------------------------
